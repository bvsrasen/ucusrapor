name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pyflakes
      - run: python -m pyflakes ucusrapor tests *.py
      - run: python -m pytest -v
      # Repodaki sonuçlar koddan aynen yeniden üretilebiliyor mu
      - run: python ucusrapor.py > /dev/null
      - run: git diff --exit-code docs/sonuclar.md

  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C c
      - run: sudo apt-get install -y -q gcc-arm-none-eabi
      - run: make -C c arm
